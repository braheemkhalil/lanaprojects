<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الدفعات — LANA PROJECTS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1A18">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الدفعات">
<style>
@import url('https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700;900&display=swap');

:root{
  --ink: #0E1A18;
  --ink-2: #142623;
  --brass: #B08D57;
  --brass-light: #D6B888;
  --teal: #3A7A72;
  --sand: #F4F1EA;
  --sand-dim: #E9E4D8;
  --rust: #B5502E;
  --rust-bg: #F3E3DA;
  --paid-bg: #E4EEE8;
  --shadow: 0 10px 30px rgba(14,26,24,0.12);
  --radius: 18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: var(--sand);
  color: var(--ink);
  font-family: 'Tajawal', sans-serif;
  min-height:100vh;
  padding-bottom: 80px;
}
h1,h2,h3,.display{ font-family: 'Markazi Text', serif; font-weight:700; }
.arch-svg{ display:block; width:100%; }
.hidden{ display:none !important; }

/* ---------- Shared buttons ---------- */
.btn{
  font-family:'Tajawal', sans-serif; font-weight:700; font-size: 14px;
  border:none; border-radius: 999px; padding: 11px 22px; cursor:pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:active{ transform: scale(0.96); }
.btn-brass{ background: var(--brass); color: var(--ink); }
.btn-brass:hover{ box-shadow: 0 6px 16px rgba(176,141,87,0.4); }
.btn-ghost{ background: transparent; border: 1.5px solid rgba(14,26,24,0.2); color: var(--ink); }
.btn-teal{ background: var(--teal); color: var(--sand); }
.btn-rust{ background: var(--rust); color: var(--sand); }
.btn-sm{ padding: 7px 16px; font-size: 12.5px; }
.btn-lg{ padding: 18px 24px; font-size: 17px; width:100%; }

/* ---------- Login screen ---------- */
.gate{
  position:fixed; inset:0; background: var(--ink);
  display:flex; align-items:center; justify-content:center; padding:20px; z-index:500;
}
.gate-card{ background: var(--sand); border-radius:20px; padding:32px 26px; width:100%; max-width:380px; text-align:center; box-shadow: var(--shadow); }
.gate-arch{ width:70px; margin:0 auto 14px; opacity:0.85; }
.gate-title{ font-size:24px; margin-bottom:4px; }
.gate-sub{ font-size:13px; color: rgba(14,26,24,0.55); margin-bottom:22px; }
.field{ margin-bottom: 14px; text-align:right; }
.field label{ display:block; font-size:12.5px; font-weight:700; color: rgba(14,26,24,0.6); margin-bottom:6px; }
.field input, .field select{
  width:100%; padding: 13px 14px; border-radius:12px;
  border: 1.5px solid rgba(14,26,24,0.15); font-family:'Tajawal',sans-serif; font-size:15px; background:#fff;
}
.field input:focus, .field select:focus{ outline:none; border-color: var(--teal); }
.gate-error{ color: var(--rust); font-size:12.5px; margin-top:10px; min-height:16px; }

/* ---------- App header ---------- */
header{
  background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  color: var(--sand); padding: 22px 20px 50px; position: relative; overflow:hidden;
}
.brand-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.wordmark{ font-weight:900; letter-spacing:2px; font-size:13px; color: var(--brass-light); }
.wordmark small{ display:block; font-weight:400; letter-spacing:3px; color: rgba(244,241,234,0.55); font-size:11px; }
.user-chip{ display:flex; align-items:center; gap:10px; }
.user-name{ font-size:13px; color: rgba(244,241,234,0.85); }
.logout-btn{ background: rgba(244,241,234,0.12); color: var(--sand); border:none; border-radius:999px; padding:8px 14px; font-size:12px; cursor:pointer; font-family:'Tajawal',sans-serif; }
.header-title{ font-size:30px; margin-top:16px; }
.header-sub{ color: rgba(244,241,234,0.6); font-size:13.5px; margin-top:4px; }

/* ---------- Stats (Ibrahim view) ---------- */
.stats{ max-width:900px; margin:-34px auto 0; padding:0 16px; display:grid; grid-template-columns: repeat(3,1fr); gap:14px; position:relative; z-index:2; }
.stat-card{ background: var(--sand); border-radius: var(--radius); box-shadow: var(--shadow); padding:16px 12px; text-align:center; }
.stat-num{ font-family:'Markazi Text',serif; font-weight:700; font-size:28px; color: var(--teal); }
.stat-num.brass{ color: var(--brass); }
.stat-num.rust{ color: var(--rust); }
.stat-label{ font-size:11.5px; color: rgba(14,26,24,0.6); margin-top:2px; }

main{ max-width:900px; margin:0 auto; padding:26px 16px; }
.section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.section-head h2{ font-size:22px; }

/* ---------- Apartment cards (Ibrahim view) ---------- */
.apts{ display:flex; flex-direction:column; gap:16px; }
.apt-card{ background:#fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; border:1px solid rgba(14,26,24,0.06); }
.apt-top{ background: var(--ink); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.apt-name{ color: var(--sand); font-family:'Markazi Text',serif; font-size:21px; font-weight:700; }
.badge{ font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap; }
.badge-rent{ background: var(--teal); color: var(--sand); }
.badge-sale{ background: var(--brass); color: var(--ink); }
.apt-body{ padding:16px 18px; }
.apt-row{ display:flex; justify-content:space-between; align-items:center; font-size:14px; color: rgba(14,26,24,0.75); margin-bottom:4px; }
.apt-row b{ color: var(--ink); font-weight:700; }
.status-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:999px; margin-top:8px; }
.status-paid{ background: var(--paid-bg); color:#3A6650; }
.status-due{ background: var(--rust-bg); color: var(--rust); }
.status-dot{ width:7px; height:7px; border-radius:50%; background: currentColor; }
.progress-wrap{ margin-top:12px; }
.progress-bar{ height:8px; background: var(--sand-dim); border-radius:999px; overflow:hidden; }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--teal), var(--brass)); border-radius:999px; }
.progress-label{ font-size:11.5px; color: rgba(14,26,24,0.55); margin-top:5px; display:flex; justify-content:space-between; }
.apt-actions{ display:flex; gap:8px; margin-top:14px; align-items:center; }
.apt-actions .btn-brass{ flex:1; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1.5px solid rgba(14,26,24,0.15);
  background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex-shrink:0; transition: transform .15s ease, background .15s ease;
}
.icon-btn:active{ transform: scale(0.92); }
.icon-btn svg{ width:17px; height:17px; }
.icon-btn.rust-icon{ border-color: rgba(181,80,46,0.35); background: var(--rust-bg); }
.icon-btn.whatsapp-icon{ border-color: rgba(58,122,114,0.35); background: var(--paid-bg); }

.empty{ text-align:center; padding:50px 20px; color: rgba(14,26,24,0.55); }
.empty .arch-svg{ width:90px; margin:0 auto 14px; opacity:0.5; }
.empty h3{ color: var(--ink); font-size:20px; margin-bottom:6px; }

/* ---------- View toggle ---------- */
.view-toggle{ display:flex; gap:8px; margin-bottom:18px; }
.view-toggle-btn{
  flex:1; padding:10px; border-radius:12px; border:1.5px solid rgba(14,26,24,0.12);
  background:#fff; font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px; cursor:pointer; color: rgba(14,26,24,0.55);
}
.view-toggle-btn.active{ background: var(--ink); color: var(--sand); border-color: var(--ink); }

/* ---------- Building browser ---------- */
.block-tabs{ display:flex; gap:8px; margin-bottom:18px; }
.block-tab{
  flex:1; padding:12px; border-radius:12px; border:1.5px solid rgba(14,26,24,0.12);
  background:#fff; font-family:'Markazi Text',serif; font-weight:700; font-size:17px; cursor:pointer; color: var(--ink);
}
.block-tab.active{ background: var(--brass); border-color: var(--brass); color: var(--ink); }

.building-diagram{ background:#fff; border-radius: var(--radius); box-shadow: var(--shadow); padding:20px 16px; }
.floor-row{ display:flex; align-items:stretch; gap:10px; margin-bottom:10px; }
.floor-label{ width:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color: rgba(14,26,24,0.45); font-weight:700; }
.floor-slots{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ground-row .floor-slots{ grid-template-columns:1fr; }

.slot{
  border-radius:12px; padding:14px 12px; cursor:pointer; text-align:center; min-height:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  transition: transform .15s ease;
}
.slot:active{ transform: scale(0.96); }
.slot-filled{ background: var(--paid-bg); border: 1.5px solid rgba(58,122,114,0.25); }
.slot-filled.slot-overdue{ background: var(--rust-bg); border-color: rgba(181,80,46,0.3); }
.slot-empty{ background: var(--sand); border: 1.5px dashed rgba(14,26,24,0.2); color: rgba(14,26,24,0.4); }
.slot-name{ font-family:'Markazi Text',serif; font-weight:700; font-size:14px; color: var(--ink); }
.slot-person{ font-size:11px; color: rgba(14,26,24,0.55); }
.slot-empty-label{ font-size:12.5px; font-weight:700; }

/* ---------- Apartment detail panel ---------- */
.detail-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.detail-name{ font-size:22px; }
.detail-loc{ font-size:12px; color: rgba(14,26,24,0.5); margin-bottom:14px; }

/* ---------- Father's simple view ---------- */
.father-wrap{ max-width:520px; margin:0 auto; padding: 8px 16px 40px; }
.father-intro{ text-align:center; margin-bottom:20px; }
.father-intro h2{ font-size:24px; }
.father-intro p{ font-size:13.5px; color: rgba(14,26,24,0.55); margin-top:4px; }
.apt-pick-grid{ display:flex; flex-direction:column; gap:12px; }
.apt-pick{
  background:#fff; border-radius:16px; padding:16px 18px; text-align:right;
  border:1.5px solid rgba(14,26,24,0.1); cursor:pointer; box-shadow: var(--shadow);
  font-family:'Tajawal',sans-serif;
}
.apt-pick:active{ transform: scale(0.98); }
.apt-pick-name{ font-family:'Markazi Text',serif; font-weight:700; font-size:20px; }
.apt-pick-person{ font-size:13px; color: rgba(14,26,24,0.55); margin-top:2px; }
.apt-pick-amt{ font-size:13px; color: var(--teal); font-weight:700; margin-top:6px; }

.pay-form{ background:#fff; border-radius:20px; padding:22px 20px; box-shadow: var(--shadow); }
.pay-form-apt{ text-align:center; margin-bottom:18px; }
.pay-form-apt .name{ font-family:'Markazi Text',serif; font-size:24px; }
.pay-form-apt .person{ font-size:13.5px; color: rgba(14,26,24,0.55); }
.big-input{ font-size:26px; text-align:center; padding:16px; font-weight:700; }
.back-link{ display:block; text-align:center; margin-top:14px; font-size:13px; color: var(--teal); background:none; border:none; cursor:pointer; text-decoration:underline; }

/* ---------- Modal (Ibrahim view) ---------- */
.overlay{ position:fixed; inset:0; background: rgba(14,26,24,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition: opacity .25s ease; }
.overlay.open{ opacity:1; pointer-events:all; }
.modal{ background: var(--sand); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:24px 22px 28px; transform: translateY(30px); transition: transform .3s ease; max-height:88vh; overflow-y:auto; position:relative; }
.overlay.open .modal{ transform: translateY(0); }
.modal h3{ font-size:22px; margin-bottom:16px; }
.modal-actions{ display:flex; gap:10px; margin-top:18px; }
.modal-actions .btn{ flex:1; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sale-fields{ display:none; }
.sale-fields.show{ display:block; }
.close-x{ background:none; border:none; font-size:22px; color: rgba(14,26,24,0.5); cursor:pointer; position:absolute; left:18px; top:18px; }

.history-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.history-item{ display:flex; justify-content:space-between; align-items:center; background: var(--sand); border-radius:12px; padding:10px 14px; border:1px dashed rgba(14,26,24,0.15); }
.history-amt{ font-weight:700; color: var(--teal); font-family:'Markazi Text',serif; font-size:18px; }
.history-date{ font-size:12px; color: rgba(14,26,24,0.5); }

/* ---------- Stamp ---------- */
.stamp-overlay{ position:fixed; inset:0; background: rgba(14,26,24,0.75); display:flex; align-items:center; justify-content:center; z-index:200; opacity:0; pointer-events:none; transition: opacity .2s ease; }
.stamp-overlay.open{ opacity:1; pointer-events:all; }
.stamp-card{ background: var(--sand); border-radius:20px; padding:40px 34px; text-align:center; width:300px; transform: scale(0.8); transition: transform .3s ease; }
.stamp-overlay.open .stamp-card{ transform: scale(1); }
.stamp-circle{ width:96px; height:96px; border-radius:50%; border:3px solid var(--brass); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; transform: scale(0) rotate(-25deg); transition: transform .45s cubic-bezier(.34,1.56,.64,1) .1s; }
.stamp-overlay.open .stamp-circle{ transform: scale(1) rotate(-12deg); }
.stamp-circle svg{ width:44px; height:44px; }
.stamp-title{ font-family:'Markazi Text',serif; font-size:24px; font-weight:700; }
.stamp-sub{ font-size:13px; color: rgba(14,26,24,0.55); margin-top:4px; }

/* ---------- Receipt ---------- */
.receipt{
  background:#fff; border-radius:14px; padding:0; margin-top:4px;
  border: 1px solid rgba(14,26,24,0.12); position:relative; overflow:hidden;
}
.receipt-watermark{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0.05; pointer-events:none;
}
.receipt-watermark svg{ width:220px; }
.receipt-inner{ position:relative; padding:26px 24px 20px; }
.receipt-topline{ height:5px; background: linear-gradient(90deg, var(--teal), var(--brass)); }
.receipt-head{ text-align:center; margin-bottom:16px; padding-bottom:16px; border-bottom: 1px solid rgba(14,26,24,0.1); }
.receipt-brand{ font-weight:900; letter-spacing:3px; font-size:14px; color: var(--ink); }
.receipt-brand small{ display:block; font-weight:400; letter-spacing:2px; color: var(--brass); font-size:10.5px; margin-top:3px; }
.receipt-addr{ font-size:10.5px; color: rgba(14,26,24,0.45); margin-top:6px; }
.receipt-meta-row{ display:flex; justify-content:space-between; font-size:11px; color: rgba(14,26,24,0.5); margin-top:10px; }
.receipt-amount-block{ text-align:center; margin: 18px 0; }
.receipt-amount-label{ font-size:11px; color: rgba(14,26,24,0.5); letter-spacing:1px; }
.receipt-amount{ font-family:'Markazi Text', serif; font-size:42px; font-weight:700; color: var(--teal); line-height:1.1; }
.receipt-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px dotted rgba(14,26,24,0.12); }
.receipt-row span:first-child{ color: rgba(14,26,24,0.55); }
.receipt-row b{ color: var(--ink); }
.receipt-row.highlight{ background: var(--sand); margin:0 -24px; padding:8px 24px; border-bottom:none; }
.receipt-sign-row{ display:flex; justify-content:space-between; margin-top:28px; gap:16px; }
.receipt-sign{ flex:1; text-align:center; }
.receipt-sign-line{ border-top: 1px dashed rgba(14,26,24,0.3); margin-top:26px; padding-top:6px; }
.receipt-sign-label{ font-size:10.5px; color: rgba(14,26,24,0.5); }
.receipt-footer{ text-align:center; margin-top:18px; font-size:10.5px; color: rgba(14,26,24,0.4); }
.receipt-stamp{
  position:absolute; width:120px; left:20px; bottom:14px;
  transform: rotate(-11deg); opacity:0.95; pointer-events:none; z-index:2;
}
.receipt-actions{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.receipt-actions .btn{ flex:1; min-width:120px; }

/* ---------- Report ---------- */
.report-year-total{ text-align:center; background: var(--sand); border-radius:16px; padding:18px; margin-bottom:16px; }
.report-year-total .num{ font-family:'Markazi Text',serif; font-size:34px; color: var(--brass); font-weight:700; }
.report-year-total .label{ font-size:12px; color: rgba(14,26,24,0.55); margin-top:2px; }
.report-month{ border-radius:14px; border:1px solid rgba(14,26,24,0.1); margin-bottom:10px; overflow:hidden; }
.report-month-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer; background:#fff; }
.report-month-name{ font-family:'Markazi Text',serif; font-size:17px; font-weight:700; }
.report-month-amt{ font-size:14px; color: var(--teal); font-weight:700; }
.report-bar-wrap{ height:5px; background: var(--sand-dim); }
.report-bar-fill{ height:100%; background: linear-gradient(90deg, var(--teal), var(--brass)); }
.report-month-detail{ display:none; padding:10px 16px 14px; background: var(--sand); }
.report-month-detail.open{ display:block; }
.report-detail-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dotted rgba(14,26,24,0.12); }

@media (max-width:420px){
  .stats{ grid-template-columns: repeat(3,1fr); gap:8px; }
  .stat-num{ font-size:22px; }
  .header-title{ font-size:26px; }
}
</style>
</head>
<body>

<!-- Login -->
<div class="gate" id="gate">
  <div class="gate-card">
    <svg class="gate-arch arch-svg" viewBox="0 0 100 140" fill="none"><path d="M10 140 V60 A40 40 0 0 1 90 60 V140" stroke="#0E1A18" stroke-width="4"/></svg>
    <h3 class="gate-title">سجل الدفعات</h3>
    <div class="gate-sub">LANA PROJECTS — تسجيل الدخول</div>
    <div class="field"><label>اسم المستخدم</label><input id="loginUsername" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button class="btn btn-brass btn-lg" onclick="doLogin()">دخول</button>
    <div class="gate-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header>
    <svg class="arch-svg" viewBox="0 0 100 140" fill="none" style="position:absolute; left:-40px; top:-40px; width:180px; opacity:0.15; pointer-events:none; z-index:0;"><path d="M10 140 V60 A40 40 0 0 1 90 60 V140" stroke="#F4F1EA" stroke-width="4"/></svg>
    <div class="brand-row" style="position:relative; z-index:1;">
      <div class="wordmark">LANA<br>PROJECTS<small>مشاريع لانا السكنية</small></div>
      <div class="user-chip">
        <span class="user-name" id="userNameLabel"></span>
        <button class="logout-btn" onclick="openSettings()">الإعدادات</button>
        <button class="logout-btn" onclick="doLogout()">خروج</button>
      </div>
    </div>
    <h1 class="header-title" id="headerTitle">سجل الدفعات</h1>
    <div class="header-sub" id="headerSub"></div>
  </header>

  <!-- Ibrahim: full dashboard -->
  <div id="ibrahimView" class="hidden">
    <div class="stats">
      <div class="stat-card"><div class="stat-num brass" id="statMonth">0</div><div class="stat-label">محصّل هذا الشهر ($)</div></div>
      <div class="stat-card"><div class="stat-num" id="statApts">0</div><div class="stat-label">عدد الشقق</div></div>
      <div class="stat-card"><div class="stat-num rust" id="statDue">0</div><div class="stat-label">متأخرات</div></div>
    </div>
    <main>
      <div class="section-head">
        <h2>الشقق</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" onclick="openReport()">التقرير الشهري</button>
          <button class="btn btn-brass" onclick="openAptModal()">+ إضافة شقة</button>
        </div>
      </div>

      <div class="view-toggle">
        <button class="view-toggle-btn active" id="viewBtnBuilding" onclick="setViewMode('building')">حسب المبنى</button>
        <button class="view-toggle-btn" id="viewBtnList" onclick="setViewMode('list')">كل الشقق</button>
      </div>

      <div class="field" style="margin-bottom:16px;">
        <input id="searchBox" placeholder="🔍 ابحث باسم المستأجر أو الشقة..." oninput="handleSearch()">
      </div>

      <div id="searchResults" class="apts hidden"></div>

      <div id="buildingView">
        <div class="block-tabs" id="blockTabs"></div>
        <div class="building-diagram" id="buildingDiagram"></div>
      </div>

      <div class="apts hidden" id="aptsList"></div>
    </main>
  </div>

  <!-- Settings -->
  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <button class="close-x" onclick="closeModal('settingsOverlay')">×</button>
      <h3>الإعدادات</h3>
      <div class="field"><label>الاسم المعروض</label><input id="s_displayName"></div>

<script>
let currentUser = null; // {username, name}
let apartments = [];
let activeAptId = null;
let lastReceipt = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n||0).toLocaleString('en-US'); }

async function api(path, options={}){
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers||{}) },
    credentials: 'same-origin'
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || 'حدث خطأ');
  return data;
}

/* ---------- Auth ---------- */
async function checkAuth(){
  try{
    const data = await api('/api/me');
    if(data.authenticated){
      currentUser = { username: data.username, name: data.name };
      showApp();
    } else {
      document.getElementById('gate').classList.remove('hidden');
    }
  }catch(e){
    document.getElementById('gate').classList.remove('hidden');
  }
}

async function doLogin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!username || !password){ err.textContent = 'الرجاء إدخال اسم المستخدم وكلمة المرور'; return; }
  try{
    const data = await api('/api/login', { method:'POST', body: JSON.stringify({username, password}) });
    currentUser = data.user;
    showApp();
  }catch(e){
    err.textContent = e.message || 'بيانات الدخول غير صحيحة';
  }
}

async function doLogout(){
  try{ await api('/api/logout', { method:'POST' }); }catch(e){}
  location.reload();
}

function showApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  document.getElementById('userNameLabel').textContent = currentUser.name;
  document.getElementById('headerTitle').textContent = 'سجل الدفعات';
  document.getElementById('headerSub').textContent = 'أهلاً ' + currentUser.name + ' — إدارة الشقق ومتابعة كل الدفعات';
  document.getElementById('ibrahimView').classList.remove('hidden');
  loadIbrahimView();
}

/* =========================================================
   IBRAHIM VIEW
   ========================================================= */
async function loadIbrahimView(){
  try{
    const data = await api('/api/apartments');
    apartments = data.apartments;
    renderStats();
    renderApts();
    if(currentViewMode === 'building') renderBuildingView();
    if(document.getElementById('searchBox').value.trim()) handleSearch();
  }catch(e){ alert('تعذّر تحميل البيانات: ' + e.message); }
}

function isOverdue(apt){
  const paid = Number(apt.total_paid);
  const today = todayISO();
  if(apt.type === 'rent'){
    if(!apt.last_payment_date) return monthsBetween(apt.start_date, today) >= 1;
    const diffDays = (new Date(today) - new Date(apt.last_payment_date)) / (1000*60*60*24);
    return diffDays > 35;
  } else {
    const elapsed = monthsBetween(apt.start_date, today);
    return paid < elapsed * Number(apt.installment_amount);
  }
}
function monthsBetween(startISO, endISO){
  const s = new Date(startISO), e = new Date(endISO);
  return Math.max(0, (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth()) + 1);
}

function renderStats(){
  const ym = new Date().toISOString().slice(0,7);
  // month total requires payments; fetched lazily per apartment is heavy, so approximate via all payments call
  api('/api/payments').then(data=>{
    const monthTotal = data.payments.filter(p=>p.payment_date.slice(0,7)===ym).reduce((s,p)=>s+Number(p.amount),0);
    document.getElementById('statMonth').textContent = fmt(monthTotal);
  }).catch(()=>{});
  document.getElementById('statApts').textContent = apartments.length;
  document.getElementById('statDue').textContent = apartments.filter(isOverdue).length;
}

const ICONS = {
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="#0E1A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.3"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="#0E1A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="#B5502E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  whatsapp: '<svg viewBox="0 0 24 24" fill="#3A7A72"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.4 1.26 4.83L2 22l5.4-1.42a9.87 9.87 0 0 0 4.64 1.18h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.36-.5.06-1.05.27-3.53-.74-2.98-1.21-4.9-4.2-5.05-4.4-.15-.2-1.2-1.6-1.2-3.05 0-1.46.77-2.17 1.04-2.47.27-.3.6-.37.8-.37h.57c.18 0 .43-.07.67.51.24.6.83 2.06.9 2.2.07.15.12.32.02.52-.1.2-.15.32-.3.5-.15.17-.31.39-.44.52-.15.15-.3.31-.13.6.17.3.77 1.27 1.66 2.06 1.14 1.02 2.1 1.34 2.4 1.5.3.15.47.12.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.28.1 1.75.83 2.05.98.3.15.5.22.57.35.08.13.08.75-.16 1.43Z"/></svg>',
};

function renderApts(){
  const wrap = document.getElementById('aptsList');
  if(apartments.length === 0){
    wrap.innerHTML = `<div class="empty">
      <svg class="arch-svg" viewBox="0 0 100 140" fill="none"><path d="M10 140 V60 A40 40 0 0 1 90 60 V140" stroke="#0E1A18" stroke-width="4"/></svg>
      <h3>لا توجد شقق بعد</h3><div>أضف أول شقة لتبدأ بتسجيل الدفعات</div></div>`;
    return;
  }
  wrap.innerHTML = apartments.map(apt=>{
    const paid = Number(apt.total_paid);
    const overdue = isOverdue(apt);
    let progressHtml = '';
    if(apt.type === 'sale'){
      const pct = Math.min(100, Math.round((paid/Number(apt.total_price))*100));
      progressHtml = `<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>$${fmt(paid)} من $${fmt(apt.total_price)}</span><span>${pct}%</span></div></div>`;
    }
    return `<div class="apt-card">
      <div class="apt-top"><div class="apt-name">${apt.name}</div><div class="badge ${apt.type==='rent'?'badge-rent':'badge-sale'}">${apt.type==='rent'?'إيجار':'تقسيط'}</div></div>
      <div class="apt-body">
        <div class="apt-row"><span>المستأجر / المشتري</span><b>${apt.person_name}</b></div>
        ${apt.phone?`<div class="apt-row"><span>الهاتف</span><b>${apt.phone}</b></div>`:''}
        <div class="apt-row"><span>${apt.type==='rent'?'الإيجار الشهري':'القسط الشهري'}</span><b>$${fmt(apt.type==='rent'?apt.rent_amount:apt.installment_amount)}</b></div>
        ${progressHtml}
        <div class="status-chip ${overdue?'status-due':'status-paid'}"><span class="status-dot"></span>${overdue?'متأخر عن الدفع':'الدفعات منتظمة'}</div>
        ${aptActionsHtml(apt, overdue)}
      </div></div>`;
  }).join('');
}

function aptActionsHtml(apt, overdue){
  return `<div class="apt-actions">
    <button class="btn btn-brass btn-sm" onclick="openPayModal(${apt.id})">+ تسجيل دفعة</button>
    <button class="icon-btn" title="السجل" onclick="openHistory(${apt.id})">${ICONS.history}</button>
    <button class="icon-btn" title="تعديل" onclick="openEditApt(${apt.id})">${ICONS.edit}</button>
    ${overdue ? `<button class="icon-btn whatsapp-icon" title="تذكير عبر واتساب" onclick="sendReminder(${apt.id})">${ICONS.whatsapp}</button>` : ''}
    <button class="icon-btn rust-icon" title="حذف" onclick="deleteApt(${apt.id})">${ICONS.trash}</button>
  </div>`;
}

function handleSearch(){
  const query = document.getElementById('searchBox').value.trim().toLowerCase();
  const resultsWrap = document.getElementById('searchResults');

  if(!query){
    resultsWrap.classList.add('hidden');
    resultsWrap.innerHTML = '';
    document.getElementById('buildingView').classList.toggle('hidden', currentViewMode!=='building');
    document.getElementById('aptsList').classList.toggle('hidden', currentViewMode!=='list');
    return;
  }

  document.getElementById('buildingView').classList.add('hidden');
  document.getElementById('aptsList').classList.add('hidden');
  resultsWrap.classList.remove('hidden');

  const matches = apartments.filter(a =>
    a.name.toLowerCase().includes(query) || a.person_name.toLowerCase().includes(query)
  );

  if(matches.length === 0){
    resultsWrap.innerHTML = `<div class="empty"><h3>لا توجد نتائج</h3><div>جرّب اسماً آخر</div></div>`;
    return;
  }

  resultsWrap.innerHTML = matches.map(apt=>{
    const overdue = isOverdue(apt);
    const loc = apt.block ? (apt.floor_number === 0 ? `بناء ${apt.block} — أرضي` : (apt.floor_number ? `بناء ${apt.block} — ط${apt.floor_number} — ${apt.side==='right'?'يمين':'شمال'}` : `بناء ${apt.block}`)) : '';
    return `<div class="apt-card">
      <div class="apt-top"><div class="apt-name">${apt.name}</div><div class="badge ${apt.type==='rent'?'badge-rent':'badge-sale'}">${apt.type==='rent'?'إيجار':'تقسيط'}</div></div>
      <div class="apt-body">
        <div class="apt-row"><span>المستأجر / المشتري</span><b>${apt.person_name}</b></div>
        ${loc ? `<div class="apt-row"><span>الموقع</span><b>${loc}</b></div>` : ''}
        <div class="status-chip ${overdue?'status-due':'status-paid'}"><span class="status-dot"></span>${overdue?'متأخر عن الدفع':'الدفعات منتظمة'}</div>
        ${aptActionsHtml(apt, overdue)}
      </div></div>`;
  }).join('');
}

/* =========================================================
   BUILDING BROWSER
   ========================================================= */
let currentBlock = '1';
let currentViewMode = 'building';

function setViewMode(mode){
  currentViewMode = mode;
  document.getElementById('viewBtnBuilding').classList.toggle('active', mode==='building');
  document.getElementById('viewBtnList').classList.toggle('active', mode==='list');
  document.getElementById('buildingView').classList.toggle('hidden', mode!=='building');
  document.getElementById('aptsList').classList.toggle('hidden', mode!=='list');
  if(mode==='building') renderBuildingView();
}

function renderBuildingView(){
  const tabsWrap = document.getElementById('blockTabs');
  tabsWrap.innerHTML = ['1','2','3'].map(b=>
    `<button class="block-tab ${b===currentBlock?'active':''}" onclick="switchBlock('${b}')">بناء ${b==='1'?'١':b==='2'?'٢':'٣'}</button>`
  ).join('');
  renderBuildingDiagram();
}

function switchBlock(b){
  currentBlock = b;
  renderBuildingView();
}

function renderBuildingDiagram(){
  const wrap = document.getElementById('buildingDiagram');
  const blockApts = apartments.filter(a => (a.block||'1') === currentBlock);

  const groundApt = blockApts.find(a => Number(a.floor_number) === 0);
  const upperApts = blockApts.filter(a => a.floor_number !== null && a.floor_number !== undefined && Number(a.floor_number) > 0);
  const maxFloor = Math.max(1, ...upperApts.map(a=>Number(a.floor_number)), 0);

  let html = '';
  for(let f = maxFloor; f >= 1; f--){
    const right = upperApts.find(a => Number(a.floor_number) === f && a.side === 'right');
    const left = upperApts.find(a => Number(a.floor_number) === f && a.side === 'left');
    html += `<div class="floor-row">
      <div class="floor-label">ط${f}</div>
      <div class="floor-slots">
        ${slotHtml(right, currentBlock, f, 'right')}
        ${slotHtml(left, currentBlock, f, 'left')}
      </div>
    </div>`;
  }
  html += `<div class="floor-row ground-row">
    <div class="floor-label">أرضي</div>
    <div class="floor-slots">${slotHtml(groundApt, currentBlock, 0, null)}</div>
  </div>`;

  wrap.innerHTML = html;
}

function slotHtml(apt, block, floor, side){
  if(apt){
    const overdue = isOverdue(apt);
    return `<div class="slot slot-filled ${overdue?'slot-overdue':''}" onclick="openAptDetail(${apt.id})">
      <div class="slot-name">${apt.name}</div>
      <div class="slot-person">${apt.person_name}</div>
    </div>`;
  }
  return `<div class="slot slot-empty" onclick="openEmptySlot('${block}', ${floor}, ${side ? `'${side}'` : null})">
    <div class="slot-empty-label">+ شاغر</div>
  </div>`;
}

function openEmptySlot(block, floor, side){
  openAptModal({ block, floor_number: floor, side });
}

function openAptDetail(aptId){
  const apt = apartments.find(a=>a.id===aptId);
  if(!apt) return;
  const paid = Number(apt.total_paid);
  const overdue = isOverdue(apt);
  let progressHtml = '';
  if(apt.type === 'sale'){
    const pct = Math.min(100, Math.round((paid/Number(apt.total_price))*100));
    progressHtml = `<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>$${fmt(paid)} من $${fmt(apt.total_price)}</span><span>${pct}%</span></div></div>`;
  }
  const loc = apt.floor_number === 0 ? `بناء ${apt.block} — الطابق الأرضي` :
    `بناء ${apt.block} — الطابق ${apt.floor_number} — ${apt.side==='right'?'يمين':'شمال'}`;

  document.getElementById('aptDetailBody').innerHTML = `
    <div class="detail-top">
      <h3 class="detail-name">${apt.name}</h3>
      <div class="badge ${apt.type==='rent'?'badge-rent':'badge-sale'}">${apt.type==='rent'?'إيجار':'تقسيط'}</div>
    </div>
    <div class="detail-loc">${loc}</div>
    <div class="apt-row"><span>المستأجر / المشتري</span><b>${apt.person_name}</b></div>
    ${apt.phone?`<div class="apt-row"><span>الهاتف</span><b>${apt.phone}</b></div>`:''}
    <div class="apt-row"><span>${apt.type==='rent'?'الإيجار الشهري':'القسط الشهري'}</span><b>$${fmt(apt.type==='rent'?apt.rent_amount:apt.installment_amount)}</b></div>
    ${progressHtml}
    <div class="status-chip ${overdue?'status-due':'status-paid'}"><span class="status-dot"></span>${overdue?'متأخر عن الدفع':'الدفعات منتظمة'}</div>
    ${aptActionsHtml(apt, overdue)}
  `;
  document.getElementById('aptDetailOverlay').classList.add('open');
}

let editingAptId = null;

function openAptModal(prefill){
  editingAptId = null;
  document.getElementById('aptModalTitle').textContent = 'شقة جديدة';
  document.getElementById('aptSaveBtn').textContent = 'حفظ الشقة';
  document.getElementById('f_name').value=''; document.getElementById('f_person').value='';
  document.getElementById('f_phone').value=''; document.getElementById('f_type').value='rent';

async function saveApartment(){
  const name = document.getElementById('f_name').value.trim();
  const person_name = document.getElementById('f_person').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const type = document.getElementById('f_type').value;
  const start_date = document.getElementById('f_start').value || todayISO();
  const block = document.getElementById('f_block').value;
  const floorRaw = document.getElementById('f_floor').value;
  const floor_number = floorRaw === '' ? null : Number(floorRaw);
  const side = floor_number > 0 ? document.getElementById('f_side').value : null;

  if(!name || !person_name){ alert('الرجاء إدخال اسم الشقة واسم المستأجر'); return; }

  if(floor_number !== null){
    const conflict = apartments.find(a =>
      a.id !== editingAptId &&
      (a.block||'1') === block &&
      Number(a.floor_number) === floor_number &&
      (floor_number === 0 || a.side === side)
    );
    if(conflict){
      alert('هذا الموقع في البناء محجوز مسبقاً للشقة "' + conflict.name + '". اختر موقعاً آخر أو عدّل تلك الشقة أولاً.');
      return;
    }
  }

  const body = { name, person_name, phone, type, start_date, block, floor_number, side };
  if(type==='rent'){ body.rent_amount = Number(document.getElementById('f_rent').value)||0; }
  else { body.total_price = Number(document.getElementById('f_total').value)||0; body.installment_amount = Number(document.getElementById('f_installment').value)||0; }
  try{
    if(editingAptId){
      await api('/api/apartments/'+editingAptId, { method:'PATCH', body: JSON.stringify(body) });
    } else {
      await api('/api/apartments', { method:'POST', body: JSON.stringify(body) });

    closeModal('aptOverlay');
    loadIbrahimView();
  }catch(e){ alert('تعذّر الحفظ: ' + e.message); }
}

const ARABIC_MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

  document.getElementById('reportMonthsList').innerHTML = `<div style="font-size:13px; text-align:center; color:rgba(14,26,24,0.5);">...جارِ التحميل</div>`;
  document.getElementById('reportOverlay').classList.add('open');
  try{
    const data = await api('/api/payments');
    renderReport(data.payments);
  }catch(e){

  }

function renderReport(payments){
  // Build the last 12 months (including current), most recent first
  const months = [];
  const now = new Date();
  for(let i=0; i<12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    months.push({ key, year: d.getFullYear(), monthIndex: d.getMonth() });
  }

  const byMonth = {};
  payments.forEach(p=>{
    const key = p.payment_date.slice(0,7);
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(p);
  });

  const totals = months.map(m => (byMonth[m.key]||[]).reduce((s,p)=>s+Number(p.amount),0));
  const maxTotal = Math.max(1, ...totals);
  const yearTotal = totals.reduce((s,t)=>s+t,0);

  document.getElementById('reportYearNum').textContent = '$' + fmt(yearTotal);

  const wrap = document.getElementById('reportMonthsList');
  wrap.innerHTML = months.map((m, i)=>{
    const total = totals[i];
    const pct = Math.round((total/maxTotal)*100);
    const monthPayments = byMonth[m.key] || [];
    const byApt = {};
    monthPayments.forEach(p=>{
      const apt = apartments.find(a=>a.id===p.apartment_id);
      const name = apt ? apt.name : 'شقة محذوفة';
      byApt[name] = (byApt[name]||0) + Number(p.amount);
    });
    const detailRows = Object.keys(byApt).length
      ? Object.entries(byApt).map(([name, amt])=>`<div class="report-detail-row"><span>${name}</span><b>$${fmt(amt)}</b></div>`).join('')
      : `<div class="report-detail-row" style="color:rgba(14,26,24,0.45);">لا توجد دفعات هذا الشهر</div>`;

    return `<div class="report-month">
      <div class="report-month-head" onclick="toggleMonthDetail('m${i}')">
        <div class="report-month-name">${ARABIC_MONTHS[m.monthIndex]} ${m.year}</div>
        <div class="report-month-amt">$${fmt(total)}</div>
      </div>
      <div class="report-bar-wrap"><div class="report-bar-fill" style="width:${pct}%"></div></div>
      <div class="report-month-detail" id="m${i}">${detailRows}</div>
    </div>`;
  }).join('');
}

  document.getElementById(id).classList.toggle('open');

.sign{ flex:1; text-align:center; }
.sign-line{ border-top:1.5px dashed rgba(14,26,24,0.35); margin-top:28px; padding-top:6px; font-size:11.5px; color: rgba(14,26,24,0.55); }

.footer{ text-align:center; margin-top:20px; padding-top:12px; border-top:1px solid rgba(14,26,24,0.1); }
.footer .thanks{ font-family:'Markazi Text',serif; font-size:15px; }
.footer .small{ font-size:9.5px; color: rgba(14,26,24,0.4); margin-top:6px; line-height:1.5; }
.print-stamp{
  position:absolute; width:150px; left:34px; bottom:8px;
  transform: rotate(-11deg); opacity:0.95; z-index:2;
}

@media print{ body{ padding:0; } .sheet{ border:none; } }
</style></head>
<body>
  <div class="sheet">
    <div class="watermark"><svg viewBox="0 0 100 140" fill="none"><path d="M10 140 V60 A40 40 0 0 1 90 60 V140" stroke="#0E1A18" stroke-width="6"/></svg></div>
    <div class="top"></div>
    <div class="inner">

      <div class="head">
        <div>
          <div class="brand">LANA PROJECTS<small>مشاريع لانا السكنية</small></div>
          <div class="addr">اللوبية</div>
        </div>
        <div class="doc-title">
          <h1>إيصال استلام دفعة</h1>
          <div class="num">رقم الإيصال #${receiptNumber(payment.id || 0)}</div>
          <div class="date">${payment.payment_date}</div>
        </div>
      </div>

      <div class="amt-block">
        <div class="amt-label">المبلغ المستلم</div>
        <div class="amt">$${fmt(payment.amount)}</div>
      </div>

      <div class="two-col">
        <div class="col">
          <h3>بيانات الشقة</h3>
          <div class="row"><span>الشقة</span><b>${apt.name}</b></div>
          <div class="row"><span>المستأجر / المشتري</span><b>${apt.person_name}</b></div>
          ${apt.phone ? `<div class="row"><span>الهاتف</span><b>${apt.phone}</b></div>` : ''}
          <div class="row"><span>نوع العقد</span><b>${isRent?'إيجار شهري':'بيع بالتقسيط'}</b></div>
          <div class="row"><span>بداية العقد</span><b>${apt.start_date}</b></div>
        </div>
        <div class="col">
          <h3>تفاصيل الدفعة</h3>
          <div class="row"><span>${isRent?'قيمة الإيجار الشهري':'قيمة القسط الشهري'}</span><b>$${fmt(isRent?apt.rent_amount:apt.installment_amount)}</b></div>
          <div class="row"><span>تاريخ الاستلام</span><b>${payment.payment_date}</b></div>
          <div class="row"><span>استلم بواسطة</span><b>${payment.recorded_by_name || currentUser.name}</b></div>
          ${payment.note ? `<div class="row"><span>ملاحظة</span><b>${payment.note}</b></div>` : ''}
        </div>
      </div>

      ${!isRent ? `
        <div class="progress-block">
          <div class="progress-labels"><span>إجمالي المدفوع: $${fmt(totalPaid)} من $${fmt(apt.total_price)}</span><span>${pct}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="highlight-row"><span>الرصيد المتبقي</span><b>$${fmt(remaining)}</b></div>
      ` : ''}

      <div class="sign-row">
        <div class="sign"><div class="sign-line">توقيع المستلم منه (${apt.person_name})</div></div>
        <div class="sign"><div class="sign-line">توقيع واستلام — LANA PROJECTS</div></div>
      </div>

      <div class="footer">
        <div class="thanks">شكراً لتعاملكم مع LANA PROJECTS</div>
        <div class="small">هذا الإيصال صادر إلكترونياً ويُعتبر إثباتاً رسمياً لاستلام الدفعة المذكورة أعلاه — يرجى الاحتفاظ به.<br>تاريخ الطباعة: ${printedAt}</div>
      </div>
      <img class="print-stamp" src="${location.origin}/ledger/paid-stamp.png" alt="">

    </div>
  </div>
  <script>
    window.onload = function(){ setTimeout(function(){ window.print(); }, 200); };
  <\/script>
</body></html>`;

  const win = window.open('', '_blank');
  if(!win){ alert('الرجاء السماح بالنوافذ المنبثقة لطباعة الإيصال'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}

checkAuth();
</script>
</body>
</html>
